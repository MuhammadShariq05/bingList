<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home · Movie Watchlist</title>
    <link rel="icon" href="../assests/home.svg" />
    <!-- UI REDESIGN: Inter font (Google Fonts) + shared stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="home">
    <!-- UI REDESIGN: Global header — logo + glass pill navigation (same markup on every page; only the active link changes) -->
    <header class="site-header">
      <div class="header-left">
        <a
          id="logo"
          class="brand"
          href="homepage.html"
          aria-label="Movie Watchlist — home"
        >
          <span class="brand-mark"
            ><img
              class="logo-img"
              src="../assests/home-logo.svg"
              alt="Movie Watchlist Logo"
          /></span>
        </a>
      </div>
      <nav id="nav" class="nav-pill" aria-label="Main navigation">
        <a class="nav-link is-active" href="homepage.html" aria-current="page"
          ><span class="icon i-home" aria-hidden="true"></span
          ><span>Home</span></a
        >
        <a class="nav-link" href="movies.html"
          ><span class="icon i-film" aria-hidden="true"></span
          ><span>Movies</span></a
        >
        <a class="nav-link" href="series.html"
          ><span class="icon i-tv" aria-hidden="true"></span
          ><span>Shows</span></a
        >
        <a class="nav-link" href="watchlist.html"
          ><span class="icon i-bookmark" aria-hidden="true"></span
          ><span>My List</span></a
        >
        <span class="nav-divider" aria-hidden="true"></span>
        <a
          class="nav-link nav-search"
          href="searchpage.html"
          aria-label="Search"
          ><span class="icon i-search" aria-hidden="true"></span
          ><span class="nav-search-label">Search</span></a
        >
      </nav>
    </header>

    <main>
      <h1 class="sr-only">Movie Watchlist — discover movies and series</h1>

      <!-- this is the main content of the page -->
      <section id="movie-list" class="movie-list">
        <!-- UI REDESIGN: Every row = heading + "View All" link + horizontally scrolling poster row with arrows.
             All container IDs are unchanged, so the existing JS keeps filling them. -->

        <!-- UI REDESIGN (new row): Trending Movies — filled by ui.js using the existing trendingMoviesThisWeek() -->
        <section class="media-section">
          <div class="section-head">
            <h2>Trending Movies</h2>
            <a class="view-all" href="movies.html"
              >View All
              <span class="icon i-arrow-right" aria-hidden="true"></span
            ></a>
          </div>
          <div class="row-scroller" data-scroller>
            <button
              class="scroll-btn prev"
              type="button"
              aria-label="Scroll left"
            >
              <span class="icon i-chevron-left" aria-hidden="true"></span>
            </button>
            <div
              id="trending-movies-week-container"
              class="media-container"
            ></div>
            <button
              class="scroll-btn next"
              type="button"
              aria-label="Scroll right"
            >
              <span class="icon i-chevron-right" aria-hidden="true"></span>
            </button>
          </div>
        </section>

        <!-- UI REDESIGN (new row): Trending Series — filled by ui.js using the existing trendingSeriesThisWeek() -->
        <section class="media-section">
          <div class="section-head">
            <h2>Trending Series</h2>
            <a class="view-all" href="series.html"
              >View All
              <span class="icon i-arrow-right" aria-hidden="true"></span
            ></a>
          </div>
          <div class="row-scroller" data-scroller>
            <button
              class="scroll-btn prev"
              type="button"
              aria-label="Scroll left"
            >
              <span class="icon i-chevron-left" aria-hidden="true"></span>
            </button>
            <div
              id="trending-series-week-container"
              class="media-container"
            ></div>
            <button
              class="scroll-btn next"
              type="button"
              aria-label="Scroll right"
            >
              <span class="icon i-chevron-right" aria-hidden="true"></span>
            </button>
          </div>
        </section>

        <!-- this will display the list of movies -->
        <section class="media-section">
          <div class="section-head">
            <h2>Now Playing</h2>
            <a class="view-all" href="movies.html"
              >View All
              <span class="icon i-arrow-right" aria-hidden="true"></span
            ></a>
          </div>
          <div class="row-scroller" data-scroller>
            <button
              class="scroll-btn prev"
              type="button"
              aria-label="Scroll left"
            >
              <span class="icon i-chevron-left" aria-hidden="true"></span>
            </button>
            <div id="current-movies-container" class="media-container">
              <!-- movie items will be dynamically added here -->
            </div>
            <button
              class="scroll-btn next"
              type="button"
              aria-label="Scroll right"
            >
              <span class="icon i-chevron-right" aria-hidden="true"></span>
            </button>
          </div>
        </section>

        <section class="media-section">
          <div class="section-head">
            <h2>Trending this Week</h2>
          </div>
          <div class="row-scroller" data-scroller>
            <button
              class="scroll-btn prev"
              type="button"
              aria-label="Scroll left"
            >
              <span class="icon i-chevron-left" aria-hidden="true"></span>
            </button>
            <div id="trending-container" class="media-container"></div>
            <button
              class="scroll-btn next"
              type="button"
              aria-label="Scroll right"
            >
              <span class="icon i-chevron-right" aria-hidden="true"></span>
            </button>
          </div>
        </section>

        <section class="media-section">
          <div class="section-head">
            <h2>Popular Movies</h2>
            <a class="view-all" href="movies.html"
              >View All
              <span class="icon i-arrow-right" aria-hidden="true"></span
            ></a>
          </div>
          <div class="row-scroller" data-scroller>
            <button
              class="scroll-btn prev"
              type="button"
              aria-label="Scroll left"
            >
              <span class="icon i-chevron-left" aria-hidden="true"></span>
            </button>
            <div id="popular-movies-container" class="media-container">
              <!-- popular movie items will be dynamically added here -->
            </div>
            <button
              class="scroll-btn next"
              type="button"
              aria-label="Scroll right"
            >
              <span class="icon i-chevron-right" aria-hidden="true"></span>
            </button>
          </div>
        </section>

        <section class="media-section">
          <div class="section-head">
            <h2>Top Rated Movies</h2>
            <a class="view-all" href="movies.html"
              >View All
              <span class="icon i-arrow-right" aria-hidden="true"></span
            ></a>
          </div>
          <div class="row-scroller" data-scroller>
            <button
              class="scroll-btn prev"
              type="button"
              aria-label="Scroll left"
            >
              <span class="icon i-chevron-left" aria-hidden="true"></span>
            </button>
            <div id="top-rated-movies-container" class="media-container">
              <!-- top rated movie items will be dynamically added here -->
            </div>
            <button
              class="scroll-btn next"
              type="button"
              aria-label="Scroll right"
            >
              <span class="icon i-chevron-right" aria-hidden="true"></span>
            </button>
          </div>
        </section>

        <section class="media-section">
          <div class="section-head">
            <h2>Airing Today · TV Shows</h2>
            <a class="view-all" href="series.html"
              >View All
              <span class="icon i-arrow-right" aria-hidden="true"></span
            ></a>
          </div>
          <div class="row-scroller" data-scroller>
            <button
              class="scroll-btn prev"
              type="button"
              aria-label="Scroll left"
            >
              <span class="icon i-chevron-left" aria-hidden="true"></span>
            </button>
            <div id="upcoming-tvshows-container" class="media-container">
              <!-- upcoming tv show items will be dynamically added here -->
            </div>
            <button
              class="scroll-btn next"
              type="button"
              aria-label="Scroll right"
            >
              <span class="icon i-chevron-right" aria-hidden="true"></span>
            </button>
          </div>
        </section>
      </section>
      <!-- UI REDESIGN: fixed an unclosed <section id="movie-list"> from the original markup -->
    </main>

    <footer class="footer-homepage">
      <a
        class="designed-by"
        href="https://github.com/MuhammadShariq05"
        target="_blank"
        rel="noopener noreferrer"
      >
        Designed by Muhammad Shariq
      </a>
    </footer>

    <script src="../js/storage.js" defer></script>
    <script src="../js/script.js" defer></script>
    <!-- UI REDESIGN: new additive script (scroll arrows, extra rows). Must load AFTER script.js -->
    <script src="../js/ui.js" defer></script>
  </body>
</html>
