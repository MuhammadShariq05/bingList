<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My List · Watchlist</title>
    <link rel="icon" href="../assests/mylist.svg" />
    <!-- UI REDESIGN: Inter font (Google Fonts) + shared stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="watchlist">
    <!-- UI REDESIGN: Global header — logo + glass pill navigation (same markup on every page; only the active link changes) -->
    <header class="site-header">
      <div class="header-left">
        <a class="back-link" href="homepage.html" aria-label="Back to home"
          ><span class="icon i-arrow-left" aria-hidden="true"></span
        ></a>
        <a
          id="logo"
          class="brand"
          href="homepage.html"
          aria-label="Movie Watchlist — home"
        >
          <span class="brand-mark"
            ><img
              class="logo-img"
              src="../assests/home-logo.svg"
              alt="Movie Watchlist Logo"
          /></span>
        </a>
      </div>
      <nav id="nav" class="nav-pill" aria-label="Main navigation">
        <a class="nav-link" href="homepage.html"
          ><span class="icon i-home" aria-hidden="true"></span
          ><span>Home</span></a
        >
        <a class="nav-link" href="movies.html"
          ><span class="icon i-film" aria-hidden="true"></span
          ><span>Movies</span></a
        >
        <a class="nav-link" href="series.html"
          ><span class="icon i-tv" aria-hidden="true"></span
          ><span>Shows</span></a
        >
        <a class="nav-link is-active" href="watchlist.html" aria-current="page"
          ><span class="icon i-bookmark" aria-hidden="true"></span
          ><span>My List</span></a
        >
        <span class="nav-divider" aria-hidden="true"></span>
        <a
          class="nav-link nav-search"
          href="searchpage.html"
          aria-label="Search"
          ><span class="icon i-search" aria-hidden="true"></span
          ><span class="nav-search-label">Search</span></a
        >
      </nav>
    </header>

    <main class="list-page">
      <!-- UI REDESIGN: "My List" heading + Watchlist/Watched tabs. The tabs are plain links between the
         two existing pages, so no JavaScript or storage logic had to change. -->
      <section class="list-header">
        <div class="list-heading">
          <div class="list-title">
            <span class="icon i-list" aria-hidden="true"></span>
            <h1>My List</h1>
          </div>
          <p>Movies and series you want to watch.</p>
        </div>
        <div class="tabs" aria-label="My List sections">
          <a class="tab is-active" href="watchlist.html" aria-current="page"
            ><span class="icon i-bookmark" aria-hidden="true"></span>Watchlist
            <span class="tab-count" data-count="watchlist"></span
          ></a>
          <a class="tab" href="watchedList.html"
            ><span class="icon i-check" aria-hidden="true"></span>Watched
            <span class="tab-count" data-count="watched"></span
          ></a>
        </div>
      </section>

      <section class="media-section">
        <div id="watchlist-container" class="media-container">
          <!-- Watchlist cards will be rendered here -->
        </div>

        <!-- UI REDESIGN: empty state card (was a plain <p>). watchlist.js still toggles its [hidden] attribute. -->
        <div id="watchlist-empty" class="empty-state" hidden>
          <div class="empty-icon">
            <span class="icon i-bookmark" aria-hidden="true"></span>
          </div>
          <h2>Your watchlist is empty</h2>
          <p>Start adding movies and series you want to watch.</p>
          <a class="btn" href="movies.html">Browse movies</a>
        </div>
      </section>
    </main>

    <script src="../js/storage.js" defer></script>
    <script src="../js/script.js" defer></script>
    <script src="../js/watchlist.js" defer></script>
    <!-- UI REDESIGN: new additive script (tab counts). Loads after the page scripts -->
    <script src="../js/ui.js" defer></script>
  </body>
</html>
