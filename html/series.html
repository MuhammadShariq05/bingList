<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Series · Movie Watchlist</title>
    <link rel="icon" href="../assests/series.svg" />
    <!-- UI REDESIGN: Inter font (Google Fonts) + shared stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body data-page="series">
    <!-- UI REDESIGN: Global header — logo + glass pill navigation (same markup on every page; only the active link changes) -->
    <header class="site-header">
      <div class="header-left">
        <a class="back-link" href="homepage.html" aria-label="Back to home"
          ><span class="icon i-arrow-left" aria-hidden="true"></span
        ></a>
        <a
          id="logo"
          class="brand"
          href="homepage.html"
          aria-label="Movie Watchlist — home"
        >
          <span class="brand-mark"
            ><img
              class="logo-img"
              src="../assests/home-logo.svg"
              alt="Movie Watchlist Logo"
          /></span>
        </a>
      </div>
      <nav id="nav" class="nav-pill" aria-label="Main navigation">
        <a class="nav-link" href="homepage.html"
          ><span class="icon i-home" aria-hidden="true"></span
          ><span>Home</span></a
        >
        <a class="nav-link" href="movies.html"
          ><span class="icon i-film" aria-hidden="true"></span
          ><span>Movies</span></a
        >
        <a class="nav-link is-active" href="series.html" aria-current="page"
          ><span class="icon i-tv" aria-hidden="true"></span
          ><span>Shows</span></a
        >
        <a class="nav-link" href="watchlist.html"
          ><span class="icon i-bookmark" aria-hidden="true"></span
          ><span>My List</span></a
        >
        <span class="nav-divider" aria-hidden="true"></span>
        <a
          class="nav-link nav-search"
          href="searchpage.html"
          aria-label="Search"
          ><span class="icon i-search" aria-hidden="true"></span
          ><span class="nav-search-label">Search</span></a
        >
      </nav>
    </header>

    <main>
      <!-- UI REDESIGN: Large page title -->
      <section class="page-hero">
        <h1>TV Series</h1>
        <p>Find your next binge-worthy show</p>
      </section>

      <!-- UI REDESIGN (new row): Airing Today — landscape cards, filled by ui.js from the existing
           /api/tv/airing-today endpoint. Hidden until data arrives. -->
      <section id="airing-series-section" class="media-section" hidden>
        <div class="section-head"><h2>Airing Today</h2></div>
        <div class="row-scroller row-scroller--landscape" data-scroller>
          <button
            class="scroll-btn prev"
            type="button"
            aria-label="Scroll left"
          >
            <span class="icon i-chevron-left" aria-hidden="true"></span>
          </button>
          <div
            id="airing-series-container"
            class="media-container landscape-row"
          ></div>
          <button
            class="scroll-btn next"
            type="button"
            aria-label="Scroll right"
          >
            <span class="icon i-chevron-right" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <!-- Trending Series -->
      <section class="media-section">
        <div class="section-head"><h2>Trending Series This Week</h2></div>
        <div class="row-scroller" data-scroller>
          <button
            class="scroll-btn prev"
            type="button"
            aria-label="Scroll left"
          >
            <span class="icon i-chevron-left" aria-hidden="true"></span>
          </button>
          <div
            id="trending-series-week-container"
            class="media-container"
          ></div>
          <button
            class="scroll-btn next"
            type="button"
            aria-label="Scroll right"
          >
            <span class="icon i-chevron-right" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <!-- Popular Series -->
      <section class="media-section">
        <div class="section-head"><h2>Popular Series</h2></div>
        <div class="row-scroller" data-scroller>
          <button
            class="scroll-btn prev"
            type="button"
            aria-label="Scroll left"
          >
            <span class="icon i-chevron-left" aria-hidden="true"></span>
          </button>
          <div id="popular-series-container" class="media-container"></div>
          <button
            class="scroll-btn next"
            type="button"
            aria-label="Scroll right"
          >
            <span class="icon i-chevron-right" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <!-- Top Rated Series -->
      <section class="media-section">
        <div class="section-head"><h2>Top Rated Series</h2></div>
        <div class="row-scroller" data-scroller>
          <button
            class="scroll-btn prev"
            type="button"
            aria-label="Scroll left"
          >
            <span class="icon i-chevron-left" aria-hidden="true"></span>
          </button>
          <div id="top-rated-series-container" class="media-container"></div>
          <button
            class="scroll-btn next"
            type="button"
            aria-label="Scroll right"
          >
            <span class="icon i-chevron-right" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <!-- Discover Series -->
      <section class="media-section">
        <!-- UI REDESIGN: Heading on the left, filter dropdowns aligned to the upper-right of the grid they control -->
        <div class="section-head section-head--filters">
          <h2>Discover Series</h2>

          <div class="filter-container filter-bar">
            <select id="genre-filter" aria-label="Filter by genre">
              <option value="">All Genres</option>
            </select>

            <select id="yearSelect" aria-label="Filter by year">
              <option value="">All Years</option>
            </select>
          </div>
        </div>

        <div id="series-discover-container" class="series-discover"></div>

        <div id="series-loader"></div>
      </section>
    </main>

    <script>
      var select = document.getElementById("yearSelect");
      var currentYear = new Date().getFullYear();
      for (var year = currentYear; year >= 1980; year--) {
        var option = document.createElement("option");
        option.value = year;
        option.textContent = year;
        select.appendChild(option);
      }
    </script>
    <script src="../js/storage.js" defer></script>
    <script src="../js/script.js" defer></script>
    <!-- UI REDESIGN: new additive script (scroll arrows, Airing Today row). Loads after script.js -->
    <script src="../js/ui.js" defer></script>
  </body>
</html>
