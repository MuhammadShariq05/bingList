<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies · Movie Watchlist</title>
    <link rel="icon" href="../assests/movie.svg" />
    <!-- UI REDESIGN: Inter font (Google Fonts) + shared stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body data-page="movies">
    <!-- UI REDESIGN: Global header — logo + glass pill navigation (same markup on every page; only the active link changes) -->
    <header class="site-header">
      <div class="header-left">
        <a class="back-link" href="homepage.html" aria-label="Back to home"
          ><span class="icon i-arrow-left" aria-hidden="true"></span
        ></a>
        <a
          id="logo"
          class="brand"
          href="homepage.html"
          aria-label="Movie Watchlist — home"
        >
          <span class="brand-mark"
            ><span class="icon i-clapper" aria-hidden="true"></span
          ></span>
        </a>
      </div>
      <nav id="nav" class="nav-pill" aria-label="Main navigation">
        <a class="nav-link" href="homepage.html"
          ><span class="icon i-home" aria-hidden="true"></span
          ><span>Home</span></a
        >
        <a class="nav-link is-active" href="movies.html" aria-current="page"
          ><span class="icon i-film" aria-hidden="true"></span
          ><span>Movies</span></a
        >
        <a class="nav-link" href="series.html"
          ><span class="icon i-tv" aria-hidden="true"></span
          ><span>Shows</span></a
        >
        <a class="nav-link" href="watchlist.html"
          ><span class="icon i-bookmark" aria-hidden="true"></span
          ><span>My List</span></a
        >
        <span class="nav-divider" aria-hidden="true"></span>
        <a
          class="nav-link nav-search"
          href="searchpage.html"
          aria-label="Search"
          ><span class="icon i-search" aria-hidden="true"></span
          ><span class="nav-search-label">Search</span></a
        >
      </nav>
    </header>

    <main>
      <!-- UI REDESIGN: Large page title -->
      <section id="info-section" class="page-hero">
        <h1>Movies</h1>
        <p>Discover the latest and greatest films</p>
      </section>

      <!-- UI REDESIGN (new row): Upcoming — landscape cards with a "Coming Soon" badge.
           Stays hidden unless ui.js successfully loads data from /api/movies/upcoming. -->
      <section id="movies-upcoming-section" class="media-section" hidden>
        <div class="section-head"><h2>Upcoming</h2></div>
        <div class="row-scroller row-scroller--landscape" data-scroller>
          <button
            class="scroll-btn prev"
            type="button"
            aria-label="Scroll left"
          >
            <span class="icon i-chevron-left" aria-hidden="true"></span>
          </button>
          <div
            id="upcoming-movies-container"
            class="media-container landscape-row"
          ></div>
          <button
            class="scroll-btn next"
            type="button"
            aria-label="Scroll right"
          >
            <span class="icon i-chevron-right" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <section id="movies-trending-section" class="media-section">
        <div class="section-head landscape"><h2>Trending this Week</h2></div>
        <div class="row-scroller" data-scroller>
          <button
            class="scroll-btn prev"
            type="button"
            aria-label="Scroll left"
          >
            <span class="icon i-chevron-left" aria-hidden="true"></span>
          </button>
          <div
            id="trending-movies-week-container"
            class="media-container trending-movies"
          >
            <!-- Dynamic uploading will be here -->
          </div>
          <button
            class="scroll-btn next"
            type="button"
            aria-label="Scroll right"
          >
            <span class="icon i-chevron-right" aria-hidden="true"></span>
          </button>
        </div>
      </section>

      <section id="all-movies-section" class="media-section">
        <div id="all-movies-container">
          <!-- UI REDESIGN: Heading on the left, filter dropdowns aligned to the upper-right of the grid they control -->
          <div class="section-head section-head--filters">
            <h2>All Movies</h2>
            <div id="query-selector" class="filter-bar">
              <!-- dynamically populating the option menu from server -->
              <select id="genre-filter" aria-label="Filter by genre">
                <option value="">All Genres</option>
              </select>
              <select id="yearSelect" aria-label="Filter by year">
                <option value="">Select Year</option>
              </select>

              <script>
                var select = document.getElementById("yearSelect");
                var currentYear = new Date().getFullYear();
                for (var year = currentYear; year >= 1980; year--) {
                  var option = document.createElement("option");
                  option.value = year;
                  option.textContent = year;
                  select.appendChild(option);
                }
              </script>
            </div>
          </div>
          <div id="movies-discover-container" class="movie-discover">
            <!-- dynamic uploading for all movies will be here getting from discovery with queries involved-->
          </div>
          <div id="movies-loader"></div>
        </div>
      </section>
    </main>

    <script src="../js/storage.js" defer></script>
    <script src="../js/script.js"></script>
    <!-- UI REDESIGN: new additive script (scroll arrows, Upcoming row). Loads after script.js -->
    <script src="../js/ui.js" defer></script>
  </body>
</html>
